# Per-container defaults and bounds.
#
# default        : limits applied when a container declares none
# defaultRequest : requests applied when a container declares none
# min / max      : the range a container is allowed to ask for
apiVersion: v1
kind: LimitRange
metadata:
  name: prod-limits
  namespace: prod
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      min:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 2Gi
