# The Kubernetes identity that Entra ID will trust.
#
# The annotation tells the workload identity webhook which Entra application or
# managed identity this service account speaks for. It is a client id, which is
# a public identifier, not a credential.
#
#   CLIENT_ID=$(az identity show -g mpetitRG -n id-prod-app --query clientId -o tsv)
#   sed "s/__MANAGED_IDENTITY_CLIENT_ID__/$CLIENT_ID/" \
#     k8s/workload-identity/serviceaccount.yaml | kubectl apply -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prod-app
  namespace: prod
  annotations:
    azure.workload.identity/client-id: __MANAGED_IDENTITY_CLIENT_ID__
